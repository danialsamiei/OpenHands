services:
  openhands:
    build:
      context: .
      dockerfile: ./containers/app/Dockerfile
      args:
        OPENHANDS_BUILD_VERSION: ${OPENHANDS_BUILD_VERSION:-qadr-fa}
    image: gantor/openhands:${OPENHANDS_BUILD_VERSION:-qadr-fa}
    container_name: qadr-openhands
    restart: unless-stopped
    environment:
      AGENT_SERVER_IMAGE_REPOSITORY: ${AGENT_SERVER_IMAGE_REPOSITORY:-ghcr.io/openhands/agent-server}
      AGENT_SERVER_IMAGE_TAG: ${AGENT_SERVER_IMAGE_TAG:-1.12.0-python}
      SANDBOX_HOST_PORT: ${SANDBOX_HOST_PORT:-39030}
      SANDBOX_USER_ID: ${SANDBOX_USER_ID:-0}
      SANDBOX_DOCKER_NETWORK: ${SANDBOX_DOCKER_NETWORK:-fgpt_ai}
      SANDBOX_STARTUP_GRACE_SECONDS: ${SANDBOX_STARTUP_GRACE_SECONDS:-90}
      SANDBOX_CONTAINER_URL_PATTERN: ${SANDBOX_CONTAINER_URL_PATTERN:-https://hands.gantor.ir/runtime/{port}}
      SANDBOX_INTERNAL_CONTAINER_URL_PATTERN: ${SANDBOX_INTERNAL_CONTAINER_URL_PATTERN:?set-in-env-file}
      SANDBOX_WEBHOOK_BASE_URL: ${SANDBOX_WEBHOOK_BASE_URL:-http://qadr-openhands:3000/api/v1/webhooks}
      WORKSPACE_MOUNT_PATH: /opt/workspace_base
      HOME: /.openhands
      OH_PERSISTENCE_DIR: /.openhands
      OH_WEB_URL: ${OH_WEB_URL:-https://hands.gantor.ir}
      OH_INTERNAL_MCP_URL: ${OH_INTERNAL_MCP_URL:-http://qadr-openhands:3000}
      OH_PERMITTED_CORS_ORIGINS_0: ${OH_PERMITTED_CORS_ORIGINS_0:-https://hands.gantor.ir}
      WEB_HOST: ${WEB_HOST:-hands.gantor.ir}
      TZ: Asia/Tehran
      SERVE_FRONTEND: "true"
      FILE_STORE: local
      FILE_STORE_PATH: /.openhands
      OPENHANDS_CONFIG_CLS: ${OPENHANDS_CONFIG_CLS:-openhands.qadr.server_config.QadrServerConfig}
      FREEGPT_OPENHANDS_REQUIRE_LOGIN: ${FREEGPT_OPENHANDS_REQUIRE_LOGIN:-true}
      FREEGPT_AUTH_BASE_URL: ${FREEGPT_AUTH_BASE_URL:-http://qadr-openwebui-app:8080}
      FREEGPT_OPENHANDS_SESSION_SECRET: ${FREEGPT_OPENHANDS_SESSION_SECRET:?set-in-env-file}
      FREEGPT_OPENHANDS_DEFAULT_LANGUAGE: ${FREEGPT_OPENHANDS_DEFAULT_LANGUAGE:-fa}
      FREEGPT_OPENHANDS_INTERNAL_MCP_HOSTS: ${FREEGPT_OPENHANDS_INTERNAL_MCP_HOSTS:-qadr-openhands:3000,openhands:3000,host.docker.internal:39030,127.0.0.1:39030,localhost:39030}
      FREEGPT_OPENHANDS_ENFORCE_LLM_DEFAULTS: ${FREEGPT_OPENHANDS_ENFORCE_LLM_DEFAULTS:-true}
      FREEGPT_OPENHANDS_INTERNAL_WEBHOOK_CIDRS: ${FREEGPT_OPENHANDS_INTERNAL_WEBHOOK_CIDRS:-172.19.0.0/16,127.0.0.1/32,::1/128}
      FREEGPT_OPENHANDS_LOAD_PUBLIC_SKILLS: ${FREEGPT_OPENHANDS_LOAD_PUBLIC_SKILLS:-false}
      FREEGPT_OPENHANDS_LOAD_USER_SKILLS: ${FREEGPT_OPENHANDS_LOAD_USER_SKILLS:-false}
      FREEGPT_OPENHANDS_LOAD_PROJECT_SKILLS: ${FREEGPT_OPENHANDS_LOAD_PROJECT_SKILLS:-true}
      FREEGPT_OPENHANDS_LOAD_ORG_SKILLS: ${FREEGPT_OPENHANDS_LOAD_ORG_SKILLS:-false}
      HIDE_LLM_SETTINGS: ${HIDE_LLM_SETTINGS:-true}
      AUTH_URL: ${AUTH_URL:-https://hands.gantor.ir/auth/login}
      QADR_OPENHANDS_LLM_MODEL: ${QADR_OPENHANDS_LLM_MODEL:-ollama/qwen2.5:3b}
      QADR_OPENHANDS_OLLAMA_BASE_URL: ${QADR_OPENHANDS_OLLAMA_BASE_URL:-http://qadr-local-llm-ollama:11434}
      QADR_OPENHANDS_OLLAMA_API_KEY: ${QADR_OPENHANDS_OLLAMA_API_KEY:-ollama-local-placeholder}
      QADR_OPENHANDS_GATEWAY_BASE_URL: ${QADR_OPENHANDS_GATEWAY_BASE_URL:-http://qadr-ai-gateway-litellm:4000/v1}
      QADR_OPENHANDS_GATEWAY_API_KEY: ${QADR_OPENHANDS_GATEWAY_API_KEY:-REPLACE_WITH_GATEWAY_SERVICE_KEY}
      QADR_OPENHANDS_GATEWAY_CUSTOM_LLM_PROVIDER: ${QADR_OPENHANDS_GATEWAY_CUSTOM_LLM_PROVIDER:-}
      QADR_OPENHANDS_EFFECTIVE_LLM_BASE_URL: ${QADR_OPENHANDS_EFFECTIVE_LLM_BASE_URL:-http://qadr-local-llm-ollama:11434}
      QADR_OPENHANDS_EFFECTIVE_LLM_API_KEY: ${QADR_OPENHANDS_EFFECTIVE_LLM_API_KEY:-ollama-local-placeholder}
      QADR_OPENHANDS_EFFECTIVE_LLM_CUSTOM_PROVIDER: ${QADR_OPENHANDS_EFFECTIVE_LLM_CUSTOM_PROVIDER:-}
      QADR_OPENHANDS_LLM_TIMEOUT: ${QADR_OPENHANDS_LLM_TIMEOUT:-360}
      QADR_OPENHANDS_LLM_MAX_MESSAGE_CHARS: ${QADR_OPENHANDS_LLM_MAX_MESSAGE_CHARS:-12000}
      QADR_OPENHANDS_LLM_MAX_OUTPUT_TOKENS: ${QADR_OPENHANDS_LLM_MAX_OUTPUT_TOKENS:-1200}
      QADR_OPENHANDS_LLM_NUM_RETRIES: ${QADR_OPENHANDS_LLM_NUM_RETRIES:-2}
      QADR_OPENHANDS_LLM_RETRY_MIN_WAIT: ${QADR_OPENHANDS_LLM_RETRY_MIN_WAIT:-2}
      QADR_OPENHANDS_LLM_RETRY_MAX_WAIT: ${QADR_OPENHANDS_LLM_RETRY_MAX_WAIT:-8}
      QADR_OPENHANDS_LLM_RETRY_MULTIPLIER: ${QADR_OPENHANDS_LLM_RETRY_MULTIPLIER:-2}
      QADR_OPENHANDS_LLM_TEMPERATURE: ${QADR_OPENHANDS_LLM_TEMPERATURE:-0.0}
      QADR_OPENHANDS_LLM_CACHING_PROMPT: ${QADR_OPENHANDS_LLM_CACHING_PROMPT:-false}
      QADR_OPENHANDS_LLM_NATIVE_TOOL_CALLING: ${QADR_OPENHANDS_LLM_NATIVE_TOOL_CALLING:-true}
      QADR_OPENHANDS_LLM_DISABLE_STOP_WORD: ${QADR_OPENHANDS_LLM_DISABLE_STOP_WORD:-false}
      QADR_OPENHANDS_LLM_REASONING_EFFORT: ${QADR_OPENHANDS_LLM_REASONING_EFFORT:-none}
      QADR_OPENHANDS_LLM_ENABLE_ENCRYPTED_REASONING: ${QADR_OPENHANDS_LLM_ENABLE_ENCRYPTED_REASONING:-false}
      QADR_OPENHANDS_LLM_EXTENDED_THINKING_BUDGET: ${QADR_OPENHANDS_LLM_EXTENDED_THINKING_BUDGET:-0}
    ports:
      - "127.0.0.1:${OPENHANDS_PORT:-39030}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENHANDS_STATE_DIR:-/srv/data/openhands-state}:/.openhands
      - ${OPENHANDS_STATE_DIR:-/srv/data/openhands-state}/config.toml:/app/config.toml:ro
      - ${OPENHANDS_WORKSPACE_DIR:-/srv/data/openhands-workspace}:/opt/workspace_base
    pull_policy: build
    stdin_open: true
    tty: true
    cpus: 3.00
    mem_limit: 4096m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - fgpt_ingress
      - fgpt_ai

networks:
  fgpt_ingress:
    external: true
    name: fgpt_ingress
  fgpt_ai:
    external: true
    name: fgpt_ai
